  <style>
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #3d3b3a;
      --text-sub: #7a7672;
      --gold-accent: #b89b58;
      --gold-pale: #f7f3eb;
      --border-color: #eae5dc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Shippori Mincho', serif;
      letter-spacing: 0.1em;
      line-height: 2.1;
      text-align: center;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* =========================================
       オープニング演出（パンダの招待状カード）
    ========================================= */
    #opening-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at center, #ffffff 0%, #f7f3eb 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.9s ease;
    }
    #opening-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panda-stage {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding-top: 75px;
    }

    .opening-panda {
      position: absolute;
      top: 0;
      width: 105px;
      height: auto;
      z-index: 2;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
      animation: pandaBob 2.4s ease-in-out infinite;
    }
    .opening-panda.left {
      left: 12px;
      --rot: -8deg;
      transform: rotate(-8deg);
    }
    .opening-panda.right {
      right: 12px;
      --rot: 8deg;
      transform: rotate(8deg);
      animation-delay: 0.4s;
    }
    @keyframes pandaBob {
      0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
      50%      { transform: translateY(-7px) rotate(var(--rot, 0deg)); }
    }

    .invitation-card-box {
      position: relative;
      z-index: 3;
      background: #ffffff;
      border: 2px solid var(--gold-accent);
      border-radius: 16px;
      padding: 36px 22px 30px;
      box-shadow: 0 18px 40px rgba(184, 155, 88, 0.22);
      animation: cardPopIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .invitation-card-box::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(184, 155, 88, 0.4);
      border-radius: 11px;
      pointer-events: none;
    }
